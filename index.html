<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Super Agent —— 一个使用 Vue 3 + Vite 构建的静态页面示例，包含主题切换和交互演示。"
    />
    <title>Super Agent · Vue 静态页面 Demo</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      ;(() => {
        try {
          const saved = localStorage.getItem('sa-theme')
          const theme =
            saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          document.documentElement.dataset.theme = theme
          document.documentElement.style.colorScheme = theme
        } catch {
          // Storage may be unavailable; the Vue app applies a default on mount.
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
